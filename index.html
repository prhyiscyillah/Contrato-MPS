<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --bg: #f6f1e7;
    --bg-elev: #ffffff;
    --text: #211d15;
    --muted: #6f6656;
    --gold: #8a6d3b;
    --gold-dark: #6e5730;
    --border: #e3dac4;
    --accent-bg: #fbf7ee;
    --danger: #b3261e;
    --success: #1e6b3a;
    --shadow: 0 10px 30px rgba(30, 24, 10, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1811;
      --bg-elev: #24201760;
      --bg-elev: #24201a;
      --text: #f2ecdd;
      --muted: #b7ac93;
      --gold: #dcbb77;
      --gold-dark: #caa561;
      --border: #3c3527;
      --accent-bg: #29241a;
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1811; --bg-elev: #24201a; --text: #f2ecdd; --muted: #b7ac93;
    --gold: #dcbb77; --gold-dark: #caa561; --border: #3c3527; --accent-bg: #29241a;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    min-height: 100vh;
    padding: 28px 14px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .brand { text-align:center; margin-bottom: 18px; }
  .brand h1 {
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
    color: var(--gold);
    font-size: 2rem;
    letter-spacing: 0.04em;
    margin: 0 0 2px;
  }
  .brand p { margin:0; color: var(--muted); font-size:.85rem; letter-spacing:.05em; }
  .brand .insta { font-size:.78rem; color: var(--muted); margin-top:4px; }
  .hr {
    height:1px; background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 18px 0 22px; opacity:.6;
  }
  .card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 20px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  h2.section {
    font-family: 'Playfair Display', Georgia, serif;
    color: var(--gold);
    font-size: 1.05rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    margin: 0 0 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;

  label { display:block; font-size:.85rem; font-weight:600; margin: 14px 0 5px; color: var(--text); }
  label.first { margin-top:0; }
  input[type=text], input[type=email], input[type=tel], input[type=date], input[type=time], input[type=number], textarea {
    width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--border);
    background: var(--accent-bg); color: var(--text); font-size:.95rem; font-family:inherit;
  }
  textarea { resize: vertical; min-height:70px; }
  .hint { font-size:.76rem; color: var(--muted); margin-top:4px; }
  .row2 { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  @media (max-width:520px){ .row2 { grid-template-columns: 1fr; } }

  .choice-grid { display:grid; grid-template-columns: 1fr 1fr; gap:8px 14px; margin-top:6px; }
  @media (max-width:480px){ .choice-grid { grid-template-columns: 1fr; } }
  .choice {
    display:flex; align-items:center; gap:9px; padding:9px 10px; border:1px solid var(--border);
    border-radius:9px; cursor:pointer; background: var(--accent-bg); font-size:.92rem;
    transition: border-color .15s, background .15s;
  }
  .choice input { accent-color: var(--gold); width:16px; height:16px; flex-shrink:0; }
  .choice.checked { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 12%, var(--accent-bg)); }

  button, .btn {
    font-family:'Inter',sans-serif; font-weight:700; font-size:.95rem; letter-spacing:.02em;
    border:none; border-radius:10px; padding:13px 22px; cursor:pointer;
    background: var(--gold); color:#fff; width:100%;
    transition: background .15s, transform .05s;
  }
  button:hover, .btn:hover { background: var(--gold-dark); }
  button:active, .btn:active { transform: scale(0.98); }
  button.secondary { background: transparent; color: var(--gold); border:1.5px solid var(--gold); }
  button.secondary:hover { background: color-mix(in srgb, var(--gold) 10%, transparent); }
  button:disabled { opacity:.5; cursor:not-allowed; }

  .muted { color: var(--muted); }
  .center { text-align:center; }
  .small { font-size:.8rem; }

  .link-box {
    display:flex; gap:8px; align-items:center; background: var(--accent-bg);
    border:1px dashed var(--gold); border-radius:10px; padding:10px 12px; margin-top:10px;

  .link-box input { border:none; background:transparent; color:var(--text); font-size:.82rem; flex:1; }
  .pin-box {

  .pin-input {
    text-align:center; font-size:1.6rem; letter-spacing:.5em; font-weight:700;

  .clause-title {
    font-family:'Playfair Display', Georgia, serif; color:var(--gold); font-size:1rem;
    margin: 20px 0 8px; text-transform:uppercase; letter-spacing:.05em;
  }
  .clause p { margin: 0 0 10px; text-align:justify; font-size:.93rem; }
  .clause p b { color: var(--text); }
  ul.plain { margin:6px 0 12px; padding-left:20px; font-size:.93rem; }
  .party-box {
    background: var(--accent-bg); border:1px solid var(--border); border-radius:10px; padding:12px 14px;
    font-size:.88rem; margin-bottom:10px;
  }
  .party-box b { display:inline-block; min-width:110px; color:var(--muted); font-weight:600; }

  .cover { text-align:center; padding: 40px 20px 30px; }
  .cover .doc-icon { font-size:2.6rem; margin-bottom:6px; }
  .cover h2 { font-family:'Playfair Display',serif; font-size:1.35rem; color:var(--text); margin: 6px 0 4px; }
  .cover p.sent { color: var(--muted); font-size:.88rem; margin-bottom: 22px; }

  #sigCanvas { touch-action:none; width:100%; height:170px; border:1.5px dashed var(--gold); border-radius:10px; background:#fff; }
  .sig-row { display:flex; gap:10px; margin-top:8px; }
  .sig-row button { width:auto; padding:9px 14px; font-size:.82rem; }

  .status-pill {
    display:inline-block; padding:4px 12px; border-radius:20px; font-size:.75rem; font-weight:700;
    letter-spacing:.03em;
  }
  .status-pending { background:#f4e2c1; color:#7a5210; }
  .status-signed { background:#d7ecdc; color: var(--success); }

  .error-msg { color: var(--danger); font-size:.85rem; margin-top:8px; display:none; }
  .footer-note { text-align:center; color:var(--muted); font-size:.72rem; margin-top:26px; line-height:1.6; }
  .hidden { display:none !important; }
  .print-only { display:none; }
  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { display:block !important; position:absolute; top:0; left:0; width:100%; padding:0; }
    .print-brand { font-family:'Playfair Display',serif; color:#8A6D3B; font-size:1.3rem; text-align:center; margin-bottom:4px; }

</style>

<script>
/* ---------------------------------------------------------------
   Utilidades de codificação (URL carrega os dados do contrato)
--------------------------------------------------------------- */
function encodePayload(obj) {
  const json = JSON.stringify(obj);
  return btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodePayload(str) {
  try {
    let b64 = str.replace(/-/g,'+').replace(/_/g,'/');
    while (b64.length % 4) b64 += '=';
    const json = decodeURIComponent(escape(atob(b64)));
    return JSON.parse(json);
  } catch (e) { return null; }
}
function fmtMoney(v) {
  const n = parseFloat(v);
  if (isNaN(n)) return v || '[valor]';
  return 'R$ ' + n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(d) {
  if (!d) return '[data]';
  const [y,m,day] = d.split('-');
  return day && m && y ? `${day}/${m}/${y}` : d;
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normalize(s){ return (s||'').toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

/* =================================================================
   TABELA DE PRE\u00c7OS \u2014 EDITE S\u00d3 AQUI para atualizar valores e pacotes.
   =================================================================
   Para cada tipo de servi\u00e7o, liste os pacotes oferecidos: nome,
   valor em reais (n\u00famero, sem "R$") e uma descri\u00e7\u00e3o curta do que
   est\u00e1 incluso. Ao escolher o "Tipo de servi\u00e7o" no painel, esses
   pacotes aparecem como op\u00e7\u00f5es \u2014 e ao tocar em um deles, o valor e
   a descri\u00e7\u00e3o s\u00e3o preenchidos automaticamente (mas continuam
   edit\u00e1veis manualmente depois).
   Tipos sem pacote cadastrado aqui (ou "Outro") n\u00e3o mostram sugest\u00e3o
   \u2014 o valor \u00e9 preenchido manualmente nesse caso.
   Essa MESMA tabela \u00e9 usada para gerar a placa A4 de valores
   (arquivo gerar-placa-precos.html / script separado).
------------------------------------------------------------------ */
const PACOTES = {
  'Ensaio Gestante': [
    { nome: 'Essencial', valor: 300, desc: '10 fotos editadas em alta resolu\u00e7\u00e3o' },
    { nome: 'Especial',  valor: 500, desc: '20 fotos editadas + 1 foto impressa 20x30' },
    { nome: 'Completo',  valor: 750, desc: '35 fotos editadas + \u00e1lbum f\u00edsico' },
  ],
  'Ensaio Newborn': [
    { nome: 'Essencial', valor: 350, desc: '10 fotos editadas em alta resolu\u00e7\u00e3o' },
    { nome: 'Especial',  valor: 550, desc: '20 fotos editadas + acess\u00f3rios do est\u00fadio' },
    { nome: 'Completo',  valor: 800, desc: '35 fotos editadas + \u00e1lbum f\u00edsico' },
  ],
  'Ensaio de Casal': [
    { nome: 'Essencial', valor: 280, desc: '10 fotos editadas em alta resolu\u00e7\u00e3o' },
    { nome: 'Especial',  valor: 450, desc: '20 fotos editadas + 1 troca de look' },
    { nome: 'Completo',  valor: 650, desc: '35 fotos editadas + \u00e1lbum f\u00edsico' },
  ],
  'Ensaio Individual/Book': [
    { nome: 'Essencial', valor: 280, desc: '10 fotos editadas em alta resolu\u00e7\u00e3o' },
    { nome: 'Especial',  valor: 450, desc: '20 fotos editadas + 1 troca de look' },
    { nome: 'Completo',  valor: 650, desc: '35 fotos editadas + \u00e1lbum f\u00edsico' },
  ],
  'Ensaio Infantil': [
    { nome: 'Essencial', valor: 280, desc: '10 fotos editadas em alta resolu\u00e7\u00e3o' },
    { nome: 'Especial',  valor: 450, desc: '20 fotos editadas + 1 troca de look' },
    { nome: 'Completo',  valor: 650, desc: '35 fotos editadas + \u00e1lbum f\u00edsico' },
  ],
  'Anivers\u00e1rio/Festa': [
    { nome: 'Essencial', valor: 400, desc: 'Cobertura de 2 horas + 20 fotos editadas' },
    { nome: 'Especial',  valor: 650, desc: 'Cobertura de 3 horas + 40 fotos editadas' },
    { nome: 'Completo',  valor: 950, desc: 'Cobertura de 4 horas + 60 fotos editadas + \u00e1lbum' },
  ],
  'Casamento': [
    { nome: 'Essencial', valor: 1500, desc: 'Cobertura de 4 horas + galeria editada' },
    { nome: 'Especial',  valor: 2500, desc: 'Cobertura de 8 horas + galeria editada + \u00e1lbum' },
    { nome: 'Completo',  valor: 3800, desc: 'Cobertura do dia todo + \u00e1lbum + v\u00eddeo highlights' },
  ],
};

/* ---------------------------------------------------------------
   Rede de segurança: qualquer erro de JS vira um aviso visível na
   tela, em vez de falhar silenciosamente (o que parecia "não faz nada").
--------------------------------------------------------------- */
function showFatalError(msg) {
  let box = document.getElementById('fatalErrorBox');
  if (!box) {
    box = document.createElement('div');
    box.id = 'fatalErrorBox';
    box.style.cssText = 'position:sticky;top:0;z-index:999;background:#b3261e;color:#fff;padding:10px 14px;font-size:.8rem;border-radius:8px;margin-bottom:14px;white-space:pre-wrap;';
    document.body.insertBefore(box, document.body.firstChild);
  }
  box.textContent = '⚠️ Erro: ' + msg;
}
window.addEventListener('error', (e) => showFatalError(e.message || String(e.error)));
window.addEventListener('unhandledrejection', (e) => showFatalError((e.reason && e.reason.message) || String(e.reason)));

const app = document.getElementById('app');
const params = new URLSearchParams(location.search);
const dParam = params.get('d');

// Estado global simples — evita ter que serializar dados grandes
// (assinatura em base64, textos com aspas etc.) dentro de atributos onclick.
const STATE = { payload: null, sigDataUrl: null, nomeFinal: null, assinadoEm: null };

if (dParam) {
  const payload = decodePayload(dParam);
  if (!payload) {
    renderInvalid();
  } else {
    STATE.payload = payload;
    try { renderClientCover(payload); } catch (e) { showFatalError('ao abrir o contrato: ' + e.message); }
  }
} else {
  try { renderBuilder(); } catch (e) { showFatalError('ao montar o painel: ' + e.message); }
}

/* ---------------------------------------------------------------
   TELA: link inválido
--------------------------------------------------------------- */
function renderInvalid() {
  app.innerHTML = `
    <div class="card center">
      <p style="font-size:2rem;margin:0 0 8px;">⚠️</p>
      <h2 class="section" style="border:none;">Link inválido</h2>
      <p class="muted">Não foi possível ler os dados deste contrato. Peça um novo link para a fotógrafa.</p>
    </div>`;
}

/* ---------------------------------------------------------------
   PAINEL DA FOTÓGRAFA — cria um novo contrato
--------------------------------------------------------------- */
function renderBuilder() {
  app.innerHTML = `
    <div class="card">
      <h2 class="section">Painel MPS Photography — Novo Contrato</h2>
      <p class="muted small" style="margin-top:-6px;">Preencha os dados do serviço já combinados com a cliente. No final você recebe um link exclusivo: a cliente preenche os dados pessoais dela e assina direto na mesma página.</p>

      <h2 class="section" style="margin-top:22px;">Tipo de serviço</h2>
      <div class="choice-grid" id="grid_tipo">
        ${['Ensaio Gestante','Ensaio Newborn','Ensaio de Casal','Ensaio Individual/Book','Ensaio Infantil','Aniversário/Festa','Casamento','Outro'].map((t,i)=>`
          <label class="choice"><input type="radio" name="tipoServico" value="${t}" ${i===0?'checked':''}> ${t}</label>
        `).join('')}
      </div>
      <input type="text" id="f_tipoOutro" placeholder="Se 'Outro', descreva" style="margin-top:8px;">

      <div id="pacotesBox"></div>

      <label>Descrição do pacote</label>
      <textarea id="f_pacote" placeholder="Ex: Galeria Especial com 20 fotos digitais em alta resolução"></textarea>

      <div class="row2">
        <div><label>Data do ensaio/evento</label><input type="date" id="f_data"></div>
        <div><label>Horário</label><input type="time" id="f_horario"></div>
      </div>
      <label>Local</label>
      <input type="text" id="f_local" placeholder="Endereço do ensaio ou evento">

      <h2 class="section" style="margin-top:22px;">Itens adicionais</h2>
      <div class="choice-grid" id="grid_extras">
        ${['Álbum impresso','Quadro decorativo','Pen drive personalizado','Sessão extra','Vídeo highlights','Making of'].map(t=>`
          <label class="choice"><input type="checkbox" name="extras" value="${t}"> ${t}</label>
        `).join('')}
      </div>
      <input type="text" id="f_extraOutro" placeholder="Outro item adicional (opcional)" style="margin-top:8px;">

      <h2 class="section" style="margin-top:22px;">Valores</h2>
      <div class="row2">
        <div><label>Valor total</label><input type="number" step="0.01" id="f_valor" placeholder="0,00"></div>
        <div><label>Sinal</label><input type="number" step="0.01" id="f_sinal" placeholder="0,00"></div>
      </div>
      <div class="row2">
        <div><label>Saldo restante</label><input type="number" step="0.01" id="f_saldo" placeholder="0,00"></div>
        <div><label>Parcelas do saldo (até)</label><input type="number" id="f_parcelas" placeholder="1"></div>
      </div>

      <label>Forma(s) de pagamento aceitas</label>
      <div class="choice-grid">
        ${['PIX','Cartão de crédito','Cartão de débito','Dinheiro'].map(t=>`
          <label class="choice"><input type="checkbox" name="pagamento" value="${t}"> ${t}</label>
        `).join('')}
      </div>

      <div class="row2" style="margin-top:14px;">
        <div><label>Prazo de entrega (dias úteis)</label><input type="number" id="f_prazo" placeholder="15"></div>
        <div><label>Antecedência p/ remarcação (dias)</label><input type="number" id="f_antecedencia" placeholder="7"></div>
      </div>

      <button type="button" style="margin-top:22px;" onclick="gerarLink()">Gerar link do contrato</button>

      <div id="resultBox" class="hidden" style="margin-top:18px;">
        <label class="first">Link para enviar ao cliente</label>
        <div class="link-box">
          <input type="text" id="linkOut" readonly>
          <button type="button" style="width:auto;padding:8px 14px;" onclick="copiarLink()">Copiar</button>
        </div>
        <button type="button" class="secondary" style="margin-top:12px;" onclick="abrirPreview()">Pré-visualizar como o cliente verá</button>
      </div>
    </div>
  `;

  syncChoices();

  const tipoInicialEl = document.querySelector('input[name="tipoServico"]:checked');
  renderPacotesBox(tipoInicialEl ? tipoInicialEl.value : '');
  document.querySelectorAll('input[name="tipoServico"]').forEach(r => {
    r.addEventListener('change', () => renderPacotesBox(r.value));
  });
}

/* ---------------------------------------------------------------
   Mostra os pacotes cadastrados (tabela PACOTES, lá em cima) para
   o tipo de serviço selecionado. Tocar em um pacote preenche
   automaticamente o valor e a descrição — e continua editável.
--------------------------------------------------------------- */
function renderPacotesBox(tipo) {
  const box = document.getElementById('pacotesBox');
  if (!box) return;
  const pacotes = PACOTES[tipo];
  if (!pacotes || !pacotes.length) {
    box.innerHTML = '<p class="hint" style="margin-top:8px;">Sem pacotes pré-cadastrados para este tipo — preencha o valor manualmente abaixo.</p>';
    return;
  }
  box.innerHTML = `
    <label style="margin-top:14px;">Pacotes de "${esc(tipo)}" <span class="muted small">(toque para preencher valor e descrição)</span></label>
    <div class="choice-grid" id="grid_pacoteSugerido" style="grid-template-columns:1fr;">
      ${pacotes.map(p => `
        <label class="choice" data-valor="${p.valor}" data-desc="${esc(p.nome + ' — ' + p.desc)}">
          <input type="radio" name="pacoteSugerido" value="${esc(p.nome)}">
          <span><b>${esc(p.nome)}</b> — ${fmtMoney(p.valor)}<br><span class="muted small">${esc(p.desc)}</span></span>
        </label>
      `).join('')}
    </div>
  `;
  box.querySelectorAll('#grid_pacoteSugerido .choice').forEach(c => {
    const input = c.querySelector('input');
    c.addEventListener('click', () => {
      box.querySelectorAll('#grid_pacoteSugerido .choice').forEach(x => x.classList.remove('checked'));
      c.classList.add('checked');
      input.checked = true;
      document.getElementById('f_valor').value = c.dataset.valor;
      document.getElementById('f_pacote').value = c.dataset.desc;
    });
  });
}

/* ---------------------------------------------------------------
   Sincroniza o visual (.choice / .checked) com os inputs de
   rádio/checkbox atualmente presentes na tela — reutilizado tanto
   no painel da fotógrafa quanto na etapa de dados da cliente.
--------------------------------------------------------------- */
function syncChoices() {
  try {
    document.querySelectorAll('.choice').forEach(c => {
      const input = c.querySelector('input');
      if (!input) return;
      const sync = () => c.classList.toggle('checked', input.checked);
      input.addEventListener('change', () => {
        if (input.type === 'radio') {
          document.querySelectorAll(`input[name="${input.name}"]`).forEach(r => r.closest('.choice').classList.remove('checked'));
        }
        sync();
      });
      sync();
    });
  } catch (e) { showFatalError('ao configurar as opções: ' + e.message); }
}

function gerarLink() {
  const tipoEl = document.querySelector('input[name="tipoServico"]:checked');
  const extras = Array.from(document.querySelectorAll('input[name="extras"]:checked')).map(e=>e.value);
  const pagamento = Array.from(document.querySelectorAll('input[name="pagamento"]:checked')).map(e=>e.value);

  const payload = {
    tipoServico: tipoEl ? tipoEl.value : '',
    tipoServicoOutro: document.getElementById('f_tipoOutro').value.trim(),
    pacote: document.getElementById('f_pacote').value.trim(),

/* --------------------------- Assinatura (canvas) --------------------------- */
let sigCtx, sigHasDrawn = false, sigDrawing = false, sigLast = null;
function setupSignaturePad() {
  const canvas = document.getElementById('sigCanvas');
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(ratio, ratio);
  sigCtx.lineWidth = 2.2;
  sigCtx.lineCap = 'round';
  sigCtx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--text') || '#111';
  sigHasDrawn = false;

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function start(e) { e.preventDefault(); sigDrawing = true; sigLast = pos(e); }
  function move(e) {
    if (!sigDrawing) return;
    e.preventDefault();
    const p = pos(e);
    sigCtx.beginPath();
    sigCtx.moveTo(sigLast.x, sigLast.y);
    sigCtx.lineTo(p.x, p.y);
    sigCtx.stroke();
    sigLast = p;
    sigHasDrawn = true;
  }
  function end() { sigDrawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}
function clearSig() {
  const canvas = document.getElementById('sigCanvas');
  sigCtx.clearRect(0,0,canvas.width,canvas.height);
  sigHasDrawn = false;
}

async function waitForJsPdf(timeoutMs) {
  const start = Date.now();
  while (Date.now() - start < timeoutMs) {
    if (window.jspdf && window.jspdf.jsPDF) return true;
    if (window.__jspdfOk === false) return false;
    await new Promise(r => setTimeout(r, 100));
  }
  return !!(window.jspdf && window.jspdf.jsPDF);
}

    // não há como salvar o arquivo diretamente (o navegador dentro do
    // artefato bloqueia downloads comuns). Abre o PDF em uma nova aba
    // como último recurso, de onde dá para salvar manualmente.
    try {
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setPdfStatus('Não consegui salvar o arquivo automaticamente aqui — abri o PDF em outra aba, use o menu de compartilhar/salvar dela.', 'error');
    } catch (e) {
      setPdfStatus('Não foi possível gerar o download neste ambiente. Erro: ' + (e && e.message ? e.message : e), 'error');
    }
    return;
  }

  try {
    await downloads.save({ filename, data: blob });
    setPdfStatus('PDF salvo com sucesso!', 'ok');
  } catch (err) {
    const code = err && err.code;
    const map = {
      declined: 'Você recusou o download. Toque em "Baixar PDF assinado" novamente se quiser salvar.',
      rate_limited: 'Muitas tentativas seguidas — aguarde alguns segundos e tente de novo.',
      too_large: 'O arquivo ficou grande demais para salvar aqui.',
      unavailable: 'O download não está disponível neste momento.',
    };
    setPdfStatus(map[code] || ('Não foi possível salvar o PDF (erro: ' + (code || (err && err.message) || 'desconhecido') + ').'), 'error');
  }
  } catch (fatal) {
    setPdfStatus('Ocorreu um erro ao gerar o PDF: ' + (fatal && fatal.message ? fatal.message : fatal), 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}
</script>
</body>
</html>
